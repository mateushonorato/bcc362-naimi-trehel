networks:
  syncnet:
    driver: overlay
    attachable: true

services:
  dashboard:
    image: tp2-dashboard:latest
    ports:
      - "30600:8080"
    environment:
      PORT: "8080"
      RUNNING_IN_DOCKER: "true"
      TZ: "America/Sao_Paulo"
      OBSERVER_URL: "http://observer:9000"
    networks:
      syncnet:
        aliases:
          - dashboard
    deploy:
      placement:
        constraints: [node.labels.vm == vm1]
