version: "3.8"

networks:
  syncnet:
    driver: overlay
    attachable: true

services:
  observer:
    image: cluster-sync:latest
    command: ["python", "observer.py"]
    networks: [syncnet]
    ports:
      - "9000:9000"
    deploy:
      placement:
        constraints: [node.labels.vm == vm1]

  node1:
    image: cluster-sync:latest
    command: ["python", "node.py"]
    environment:
      NODE_ID: "node1"
      INITIAL_FATHER: ""
      HAS_TOKEN: "true"
      SYNC_ENABLED: "${SYNC_ENABLED:-true}"
      CS_MIN_SLEEP: "${CS_MIN_SLEEP:-0.2}"
      CS_MAX_SLEEP: "${CS_MAX_SLEEP:-1.0}"
    networks: [syncnet]
    ports:
      - "8001:8000"
    deploy:
      placement:
        constraints: [node.labels.vm == vm1]

  node2:
    image: cluster-sync:latest
    command: ["python", "node.py"]
    environment:
      NODE_ID: "node2"
      INITIAL_FATHER: "node1"
