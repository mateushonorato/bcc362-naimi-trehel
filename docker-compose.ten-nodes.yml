services:
  node6:
    build: .
    command: ["python", "node.py"]
    environment:
      NODE_ID: "node6"
      INITIAL_FATHER: "node1"
      HAS_TOKEN: "false"
      SYNC_ENABLED: "${SYNC_ENABLED:-true}"
      CS_MIN_SLEEP: "${CS_MIN_SLEEP:-0.2}"
      CS_MAX_SLEEP: "${CS_MAX_SLEEP:-1.0}"
    ports:
      - "8006:8000"
    depends_on: [observer, node1]

  node7:
    build: .
    command: ["python", "node.py"]
    environment:
      NODE_ID: "node7"
      INITIAL_FATHER: "node1"
      HAS_TOKEN: "false"
      SYNC_ENABLED: "${SYNC_ENABLED:-true}"
