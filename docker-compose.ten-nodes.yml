  client6:
    build: .
    command: ["python", "client.py"]
    environment:
      CLIENT_ID: "client6"
      TARGET_URL: "http://node6:8000"
      NUM_REQUESTS: "${NUM_REQUESTS:-10}"
      CLIENT_MIN_SLEEP: "${CLIENT_MIN_SLEEP:-1.0}"
      CLIENT_MAX_SLEEP: "${CLIENT_MAX_SLEEP:-5.0}"
      RANDOM_SEED: "${RANDOM_SEED:-42}"
      CLIENT_TIMEOUT: "${CLIENT_TIMEOUT:-300.0}"
    depends_on: [node1, node6]

