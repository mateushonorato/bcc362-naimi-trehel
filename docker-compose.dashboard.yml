name: tp2-dashboard

services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      RUNNING_IN_DOCKER: "true"
      TZ: "${TZ:-America/Sao_Paulo}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app

networks:
  default:
    name: tp2-net
