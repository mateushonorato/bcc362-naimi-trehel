services:
  observer:
    build: .
    command: ["python", "observer.py"]
    ports:
      - "9000:9000"

  node1:
    build: .
    command: ["python", "node.py"]
    environment:
      NODE_ID: "node1"
      INITIAL_FATHER: ""
      HAS_TOKEN: "true"
      SYNC_ENABLED: "${SYNC_ENABLED:-true}"
      CS_MIN_SLEEP: "${CS_MIN_SLEEP:-0.2}"
      CS_MAX_SLEEP: "${CS_MAX_SLEEP:-1.0}"
    ports:
      - "8001:8000"
    depends_on: [observer]

  node2:
    build: .
    command: ["python", "node.py"]
    environment:
      NODE_ID: "node2"
      INITIAL_FATHER: "node1"
      HAS_TOKEN: "false"
      SYNC_ENABLED: "${SYNC_ENABLED:-true}"
      CS_MIN_SLEEP: "${CS_MIN_SLEEP:-0.2}"
      CS_MAX_SLEEP: "${CS_MAX_SLEEP:-1.0}"
    ports:
      - "8002:8000"
    depends_on: [observer, node1]

  node3:
